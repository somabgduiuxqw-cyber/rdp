name: Tailscale Free RDP Server

on:
  push:             
  workflow_dispatch: 

jobs:
  build-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    # Official Tailscale Action automatically downloads, installs, and connects safely on Windows
    - name: Connect Tailscale Network
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        version: latest

    - name: Create Windows Login Credentials
      run: |
        $Password = "FreeRDPPass2026!"
        $User = "CloudUser"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        New-LocalUser -Name $User -Password $SecPassword -Description "RDP Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $User
        Add-LocalGroupMember -Group "Administrators" -Member $User

    - name: Enable Remote Desktop Services
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Show Connection Details
      run: |
        # Pull the valid internal Tailscale IP directly 
        $tsIP = (tailscale ip -4)
        Write-Host "============================================="
        Write-Host "           RDP SERVER IS READY               "
        Write-Host "============================================="
        Write-Host " IP ADDRESS : $tsIP"
        Write-Host " USERNAME   : CloudUser"
        Write-Host " PASSWORD   : FreeRDPPass2026!"
        Write-Host "============================================="

    - name: Keep Virtual Machine Active
      run: |
        $timeout = New-TimeSpan -Minutes 350
        $sw = [diagnostics.stopwatch]::StartNew()
        while ($sw.elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
        }
