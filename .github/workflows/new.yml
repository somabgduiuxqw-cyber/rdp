name: Tailscale Free RDP Server

on:
  push:             
  workflow_dispatch: 

jobs:
  build-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Download and Install Tailscale (MSI Fix)
      run: |
        $tsUrl = "https://tailscale.com"
        $installerPath = "$env:TEMP\tailscale-setup.msi"
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
        Start-Process msiexec.exe -ArgumentList "/i", $installerPath, "/qn", "/norestart" -Wait
        Remove-Item $installerPath -Force
        # Force Windows to reload environment variables
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

    - name: Connect to Tailscale Network
      run: |
        # Fallback logic to find the exact executable path if standard path fails
        $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tsPath)) {
            $tsPath = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
        }
        if (-not $tsPath) {
            Write-Error "Tailscale installation folder could not be located."
            exit 1
        }
        & $tsPath up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --hostname=github-free-rdp

    - name: Create Windows Login Credentials
      run: |
        $Password = "FreeRDPPass2026!"
        $User = "CloudUser"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        New-LocalUser -Name $User -Password $SecPassword -Description "RDP Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $User
        Add-LocalGroupMember -Group "Administrators" -Member $User

    - name: Enable Remote Desktop Services
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Show Connection Details
      run: |
        $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tsPath)) { $tsPath = "tailscale" }
        $tsIP = (& $tsPath ip -4)
        Write-Host "============================================="
        Write-Host "           RDP SERVER IS READY               "
        Write-Host "============================================="
        Write-Host " IP ADDRESS : $tsIP"
        Write-Host " USERNAME   : CloudUser"
        Write-Host " PASSWORD   : FreeRDPPass2026!"
        Write-Host "============================================="

    - name: Keep Virtual Machine Active
      run: |
        $timeout = New-TimeSpan -Minutes 350
        $sw = [diagnostics.stopwatch]::StartNew()
        while ($sw.elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
        }
