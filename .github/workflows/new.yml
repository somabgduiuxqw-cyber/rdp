name: Tailscale Free RDP Server

on:
  push:             # <-- This forces it to start automatically on every code commit!
  workflow_dispatch: 

jobs:
  build-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # Keeps the server running for up to 6 hours max

    steps:
    - name: Download and Install Tailscale
      run: |
        $tsUrl = "https://tailscale.com"
        $installerPath = "$env:TEMP\tailscale-setup.exe"
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
        Start-Process $installerPath -ArgumentList "/quiet", "/norestart" -Wait
        Remove-Item $installerPath -Force

    - name: Connect to Tailscale Network
      run: |
        & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --hostname=github-free-rdp

    - name: Create Windows Login Credentials
      run: |
        # Creates a secure username: CloudUser and dynamic Password
        $Password = "FreeRDPPass2026!"
        $User = "CloudUser"
        $SecPassword = ConvertTo-SecureString $Password -AsPlainText -Force
        New-LocalUser -Name $User -Password $SecPassword -Description "RDP Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $User
        Add-LocalGroupMember -Group "Administrators" -Member $User

    - name: Enable Remote Desktop Services
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Show Connection Details
      run: |
        $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4)
        Write-Host "============================================="
        Write-Host "           RDP SERVER IS READY               "
        Write-Host "============================================="
        Write-Host " IP ADDRESS : $tsIP"
        Write-Host " USERNAME   : CloudUser"
        Write-Host " PASSWORD   : FreeRDPPass2026!"
        Write-Host "============================================="

    - name: Keep Virtual Machine Active
      run: |
        # Loop prevents the server from closing down instantly
        $timeout = New-TimeSpan -Minutes 350
        $sw = [diagnostics.stopwatch]::StartNew()
        while ($sw.elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
        }
